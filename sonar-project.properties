
# Identitas proyek SonarQube
sonar.projectKey=ifs24051-pabwe2026-sk-p6-svelte
sonar.projectName=ifs24051-pabwe2026-sk-p6-svelte
sonar.projectVersion=1.0

# Sumber kode
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Bahasa JavaScript dan Svelte
sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs,.svelte
sonar.typescript.file.suffixes=.ts,.tsx

# Pengecualian file yang tidak perlu dianalisis
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Lokasi file pengujian
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.test.svelte.js

# Abaikan file tes dari penghitungan coverage
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/setupTests.js

# Lokasi laporan coverage Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
